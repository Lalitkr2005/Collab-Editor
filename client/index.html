<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Collab Editor — Week 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title { font-size: 16px; font-weight: 600; }

    .status {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1f2428;
      border: 1px solid #30363d;
    }

    .status.connected { color: #3fb950; border-color: #3fb950; }
    .status.disconnected { color: #f85149; border-color: #f85149; }

    .editor-area {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .editor-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7d8590;
    }

    textarea {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 15px;
      line-height: 1.6;
      padding: 16px;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: #58a6ff; }

    .log {
      height: 120px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 12px;
      overflow-y: auto;
      color: #7d8590;
    }

    .log-entry { padding: 1px 0; }
    .log-entry.sent { color: #58a6ff; }
    .log-entry.received { color: #3fb950; }
    .log-entry.system { color: #f0883e; }
  </style>
</head>
<body>

<div class="header">
  <div class="title">🔴 Collab Editor — Week 1</div>
  <div class="status disconnected" id="status">Connecting...</div>
</div>

<div class="editor-area">
  <div class="editor-label">Type here — changes sync to all open tabs</div>
  <textarea 
    id="editor" 
    placeholder="Start typing... open another tab to see real-time sync"
    spellcheck="false"
  ></textarea>
  <div class="log" id="log"></div>
</div>

<script>
  const editor  = document.getElementById('editor');
  const statusEl = document.getElementById('status');
  const logEl   = document.getElementById('log');

  // Track whether an incoming update is being applied
  // so we don't re-broadcast it (infinite loop prevention)
  let applyingRemoteUpdate = false;

  function addLog(message, type = 'system') {
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // Connect to WebSocket server
  const ws = new WebSocket('ws://localhost:8080');

  ws.onopen = () => {
    statusEl.textContent = 'Connected';
    statusEl.className = 'status connected';
    addLog('Connected to server', 'system');
  };

  ws.onclose = () => {
    statusEl.textContent = 'Disconnected';
    statusEl.className = 'status disconnected';
    addLog('Disconnected from server', 'system');
  };

  ws.onerror = (error) => {
    addLog(`Connection error — is the server running?`, 'system');
  };

  // When a message arrives from the server
  ws.onmessage = (event) => {
    const message = JSON.parse(event.data);

    if (message.type === 'connected') {
      addLog(`${message.clients} client(s) connected`, 'system');
      return;
    }

    if (message.type === 'user_left') {
      addLog(`A user left. ${message.clients} client(s) remaining`, 'system');
      return;
    }

    if (message.type === 'text_update') {
      // Save cursor position before updating
      const cursorStart = editor.selectionStart;
      const cursorEnd   = editor.selectionEnd;

      // Apply the remote update
      applyingRemoteUpdate = true;
      editor.value = message.content;
      applyingRemoteUpdate = false;

      // Restore cursor position
      editor.setSelectionRange(cursorStart, cursorEnd);

      addLog(`Received update (${message.content.length} chars)`, 'received');
    }
  };

  // When the user types — send update to server
  editor.addEventListener('input', () => {
    // Do not send if we are applying a remote update
    if (applyingRemoteUpdate) return;

    const message = {
      type:    'text_update',
      content: editor.value
    };

    ws.send(JSON.stringify(message));
    addLog(`Sent update (${editor.value.length} chars)`, 'sent');
  });
</script>
</body>
</html>
