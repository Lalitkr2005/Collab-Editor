<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Collab Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title { font-size: 15px; font-weight: 600; flex-shrink: 0; }

    .room-info {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1f2428;
      border: 1px solid #30363d;
      color: #7d8590;
      font-family: monospace;
    }

    .room-info span { color: #f0883e; font-weight: 600; }

    .status {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1f2428;
      border: 1px solid #30363d;
      flex-shrink: 0;
    }

    .status.connected    { color: #3fb950; border-color: #3fb950; }
    .status.disconnected { color: #f85149; border-color: #f85149; }

    .room-bar {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 10px 20px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .room-bar input {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      width: 200px;
      font-family: monospace;
    }

    .room-bar input:focus { border-color: #58a6ff; }

    .room-bar button {
      background: #238636;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 13px;
      padding: 6px 14px;
      cursor: pointer;
      font-weight: 500;
    }

    .room-bar button:hover { background: #2ea043; }

    .copy-btn {
      background: #1f2428 !important;
      border: 1px solid #30363d !important;
      color: #e6edf3 !important;
      font-size: 12px !important;
    }

    .editor-area {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .editor-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7d8590;
    }

    textarea {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.6;
      padding: 16px;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: #58a6ff; }

    .log {
      height: 100px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 12px;
      overflow-y: auto;
      color: #7d8590;
      flex-shrink: 0;
    }

    .log-entry { padding: 1px 0; }
    .log-entry.sent     { color: #58a6ff; }
    .log-entry.received { color: #3fb950; }
    .log-entry.system   { color: #f0883e; }
  </style>
</head>
<body>

<div class="header">
  <div class="title">⚡ Collab Editor</div>
  <div class="room-info">Room: <span id="roomDisplay">—</span></div>
  <div class="status disconnected" id="status">Connecting...</div>
</div>

<div class="room-bar">
  <input type="text" id="roomInput" placeholder="Enter room name..." />
  <button onclick="joinRoom()">Join Room</button>
  <button class="copy-btn" onclick="copyRoomLink()">Copy Link</button>
</div>

<div class="editor-area">
  <div class="editor-label">Type here — syncs to everyone in the same room</div>
  <textarea
    id="editor"
    placeholder="Join a room above, then start typing..."
    spellcheck="false"
  ></textarea>
  <div class="log" id="log"></div>
</div>

<script>
  const editor     = document.getElementById('editor');
  const statusEl   = document.getElementById('status');
  const logEl      = document.getElementById('log');
  const roomInput  = document.getElementById('roomInput');
  const roomDisplay = document.getElementById('roomDisplay');

  let ws = null;
  let currentRoom = null;
  let applyingRemoteUpdate = false;

  // ── Logging ──────────────────────────────────────────────
  function addLog(message, type = 'system') {
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ── Room from URL ─────────────────────────────────────────
  // If URL has ?room=abc123, auto-join that room on page load
  function getRoomFromURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get('room');
  }

  // ── Join a Room ───────────────────────────────────────────
  function joinRoom() {
    const roomId = roomInput.value.trim() || 'default';

    // Close existing connection if switching rooms
    if (ws) {
      ws.close();
      addLog(`Left room "${currentRoom}"`, 'system');
    }

    currentRoom = roomId;
    roomDisplay.textContent = roomId;
    editor.value = '';

    // Update URL so the link is shareable
    const newUrl = `${window.location.pathname}?room=${roomId}`;
    window.history.pushState({}, '', newUrl);

    // Connect with room in query string
    // Server reads this to put socket in correct room
    ws = new WebSocket(`ws://localhost:8080?room=${roomId}`);

    ws.onopen = () => {
      statusEl.textContent = 'Connected';
      statusEl.className = 'status connected';
      addLog(`Joined room "${roomId}"`, 'system');
    };

    ws.onclose = () => {
      statusEl.textContent = 'Disconnected';
      statusEl.className = 'status disconnected';
    };

    ws.onerror = () => {
      addLog('Connection error — is the server running?', 'system');
    };

    ws.onmessage = (event) => {
      const message = JSON.parse(event.data);

      if (message.type === 'connected') {
        addLog(`Room has ${message.clients} client(s)`, 'system');
        return;
      }

      if (message.type === 'user_joined') {
        addLog(`Someone joined. ${message.clients} in room`, 'system');
        return;
      }

      if (message.type === 'user_left') {
        addLog(`Someone left. ${message.clients} in room`, 'system');
        return;
      }

      if (message.type === 'text_update') {
        const cursorStart = editor.selectionStart;
        const cursorEnd   = editor.selectionEnd;

        applyingRemoteUpdate = true;
        editor.value = message.content;
        applyingRemoteUpdate = false;

        editor.setSelectionRange(cursorStart, cursorEnd);
        addLog(`Received update (${message.content.length} chars)`, 'received');
      }
    };
  }

  // ── Send on Typing ────────────────────────────────────────
  editor.addEventListener('input', () => {
    if (applyingRemoteUpdate) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    ws.send(JSON.stringify({
      type:    'text_update',
      content: editor.value
    }));

    addLog(`Sent update (${editor.value.length} chars)`, 'sent');
  });

  // ── Copy shareable link ───────────────────────────────────
  function copyRoomLink() {
    if (!currentRoom) {
      addLog('Join a room first', 'system');
      return;
    }
    const link = `${window.location.origin}${window.location.pathname}?room=${currentRoom}`;
    navigator.clipboard.writeText(link).then(() => {
      addLog(`Link copied: ${link}`, 'system');
    });
  }

  // ── Auto-join from URL on page load ──────────────────────
  const roomFromURL = getRoomFromURL();
  if (roomFromURL) {
    roomInput.value = roomFromURL;
    joinRoom();
  }
</script>
</body>
</html>
